version: "3.9"

services:
  vittabodh:
    build: .
    image: vittabodh:latest
    container_name: vittabodh-app
    ports:
      - "5000:8080"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PORT=8080
    volumes:
      # Mount models directory so you can retrain without rebuilding image
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
